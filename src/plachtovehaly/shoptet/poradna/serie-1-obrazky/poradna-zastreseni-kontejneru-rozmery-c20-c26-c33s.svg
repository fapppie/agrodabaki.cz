<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Zastřešení mezi dva lodní kontejnery. Co změřit před výběrem střechy a čela?</title><desc id="desc">Dva kontejnery se schematickou střechou: rozteč podpěr a volný prostor mezi kontejnery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><text x="75" y="135" font-size="36" font-weight="700">Ověřte podpěry i volný profil</text><rect x="140" y="330" width="220" height="220" rx="12" fill="#d7e3df" stroke="#273a3d" stroke-width="3"/><rect x="840" y="330" width="220" height="220" rx="12" fill="#d7e3df" stroke="#273a3d" stroke-width="3"/><path d="M180 350 L180 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M225 350 L225 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M270 350 L270 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M315 350 L315 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M880 350 L880 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M925 350 L925 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M970 350 L970 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M1015 350 L1015 530" fill="none" stroke="#93aca3" stroke-width="4"/><path d="M250 330 Q600 65 950 330" fill="none" stroke="#273a3d" stroke-width="8"/><circle cx="250" cy="330" r="10" fill="#f3c54c" stroke="#273a3d" stroke-width="2"/><circle cx="950" cy="330" r="10" fill="#f3c54c" stroke="#273a3d" stroke-width="2"/><path d="M255 595 L945 595" fill="none" stroke="#a57312" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="305" y="645" font-size="27" font-weight="400">Rozteč montážních bodů podle výkresu</text><text x="475" y="410" font-size="32" font-weight="700">VOLNÝ</text><text x="445" y="455" font-size="32" font-weight="700">PRŮJEZD</text><text x="75" y="695" font-size="25" font-weight="400">Výška zastřešení sama neurčuje výšku vjezdu.</text></g></svg>