<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Vejde se můj traktor do plachtové haly? Jak změřit soupravu, vrata a místo u stěny</title><desc id="desc">Traktor ve vratovém otvoru: měřit maximální obrys soupravy a skutečný volný průjezd.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><rect x="225" y="180" width="650" height="355" rx="12" fill="#e4eeeb" stroke="#273a3d" stroke-width="3"/><rect x="360" y="255" width="380" height="280" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="480" y="320" width="140" height="110" rx="12" fill="#c9dfe2" stroke="#273a3d" stroke-width="3"/><rect x="430" y="420" width="240" height="70" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><rect x="405" y="430" width="60" height="105" rx="12" fill="#273a3d" stroke="#273a3d" stroke-width="3"/><rect x="635" y="430" width="60" height="105" rx="12" fill="#273a3d" stroke="#273a3d" stroke-width="3"/><rect x="490" y="295" width="20" height="25" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><path d="M320 260 L320 530" fill="none" stroke="#a57312" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M365 570 L735 570" fill="none" stroke="#a57312" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="80" y="135" font-size="34" font-weight="700">Celá souprava v přepravní poloze</text><text x="890" y="310" font-size="26" font-weight="400">Volný otvor</text><text x="890" y="345" font-size="26" font-weight="400">při otevření</text><path d="M885 355 L745 355" fill="none" stroke="#273a3d" stroke-width="4"/><text x="405" y="615" font-size="28" font-weight="400">Šířka průjezdu</text><text x="75" y="665" font-size="28" font-weight="400">Započítejte výbavu, nářadí a podmínky příjezdu.</text></g></svg>