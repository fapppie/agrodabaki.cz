<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Jak poznat správné kladívko do mulčovače AGE nebo AGF</title><desc id="desc">Přehled údajů pro výběr kladívka: štítek, číslo dílu a pět porovnávaných vlastností.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><text x="75" y="135" font-size="36" font-weight="700">Nejdřív model, potom rozměry</text><rect x="75" y="185" width="430" height="360" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="110" y="240" font-size="29" font-weight="700">ŠTÍTEK STROJE</text><text x="110" y="300" font-size="26" font-weight="400">Model a výrobní číslo</text><text x="110" y="350" font-size="26" font-weight="400">Číslo dílu z rozkresu</text><text x="110" y="400" font-size="26" font-weight="400">Fotografie uchycení</text><text x="110" y="475" font-size="25" font-weight="700">AGE ≠ automaticky AGF</text><rect x="560" y="185" width="565" height="360" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="600" y="240" font-size="29" font-weight="700">CO POROVNAT</text><text x="600" y="300" font-size="27" font-weight="400">01  Šířka uchycení</text><text x="600" y="350" font-size="27" font-weight="400">02  Průměr otvoru</text><text x="600" y="400" font-size="27" font-weight="400">03  Délka a pracovní šířka</text><text x="600" y="450" font-size="27" font-weight="400">04  Tvar a odsazení</text><text x="600" y="500" font-size="27" font-weight="400">05  Předepsaná hmotnost</text><text x="75" y="625" font-size="32" font-weight="700">Fotografie + měření + dokumentace</text><text x="75" y="670" font-size="27" font-weight="400">Podobný vzhled není potvrzením kompatibility.</text></g></svg>