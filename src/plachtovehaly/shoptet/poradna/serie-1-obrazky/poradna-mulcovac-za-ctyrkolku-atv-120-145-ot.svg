<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Mulčovač za čtyřkolku do sadu. Jak vybrat mezi ATV 120 a ATV 145 OT?</title><desc id="desc">Pohled shora na schematický mulčovač: pracovní záběr mezi boky a širší obrys včetně kol.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><text x="75" y="135" font-size="34" font-weight="700">Záběr a celková šířka jsou různé údaje</text><rect x="310" y="260" width="580" height="170" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><rect x="230" y="290" width="65" height="150" rx="12" fill="#273a3d" stroke="#273a3d" stroke-width="3"/><rect x="905" y="290" width="65" height="150" rx="12" fill="#273a3d" stroke="#273a3d" stroke-width="3"/><path d="M295 330 L310 330" fill="none" stroke="#273a3d" stroke-width="4"/><path d="M890 330 L905 330" fill="none" stroke="#273a3d" stroke-width="4"/><path d="M600 260 L600 190" fill="none" stroke="#273a3d" stroke-width="4"/><path d="M315 480 L885 480" fill="none" stroke="#a57312" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="440" y="525" font-size="30" font-weight="400">Pracovní záběr</text><path d="M235 580 L965 580" fill="none" stroke="#a57312" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="420" y="630" font-size="30" font-weight="400">Celková šířka s koly</text><text x="75" y="685" font-size="26" font-weight="400">Průjezd ověřte pro skutečné uspořádání stroje.</text></g></svg>