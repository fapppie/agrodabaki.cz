<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Lžíce na podkop BH nebo BH 5 R. Co ověřit před objednáním?</title><desc id="desc">Čtyři podkopové lžíce ve dvou rodinách BH a BH 5 R: šířky, počet zubů a objednací kódy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><text x="75" y="135" font-size="34" font-weight="700">Nejdřív rodina podkopu, potom šířka</text><rect x="75" y="190" width="510" height="355" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="615" y="190" width="510" height="355" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="110" y="250" font-size="38" font-weight="700">BH</text><text x="650" y="250" font-size="38" font-weight="700">BH 5 R</text><text x="110" y="330" font-size="30" font-weight="400">30 cm / 3 zuby</text><text x="110" y="375" font-size="27" font-weight="400">Kód 1000188</text><text x="110" y="450" font-size="30" font-weight="400">40 cm / 4 zuby</text><text x="110" y="495" font-size="27" font-weight="400">Kód 1000189</text><text x="650" y="330" font-size="30" font-weight="400">30 cm / 3 zuby</text><text x="650" y="375" font-size="27" font-weight="400">Kód 1000192</text><text x="650" y="450" font-size="30" font-weight="400">40 cm / 4 zuby</text><text x="650" y="495" font-size="27" font-weight="400">Kód 1000193</text><text x="75" y="620" font-size="30" font-weight="700">Stejná šířka nepotvrzuje stejné uchycení.</text><text x="75" y="670" font-size="27" font-weight="400">Porovnejte model, čepy, rozteče a připojovací šířky.</text></g></svg>