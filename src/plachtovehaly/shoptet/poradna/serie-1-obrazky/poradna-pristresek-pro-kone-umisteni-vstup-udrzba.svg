<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Přístřešek pro koně na pastvině. Jak naplánovat vchod, dovoz sena a čištění?</title><desc id="desc">Modelový půdorys přístřešku s volným vstupem a návazností na napájení, krmení a obsluhu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a57312"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#1f292b"><text x="75" y="65" font-size="24" font-weight="700">AGRO DABAKI / PORADNA</text><text x="75" y="135" font-size="36" font-weight="700">Přístřešek jako součást provozu</text><rect x="420" y="210" width="380" height="230" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="475" y="305" font-size="30" font-weight="700">PŘÍSTŘEŠEK</text><path d="M530 440 L700 440" fill="none" stroke="#f3c54c" stroke-width="4"/><rect x="420" y="475" width="380" height="105" rx="12" fill="#f7eccb" stroke="#273a3d" stroke-width="3"/><text x="465" y="535" font-size="25" font-weight="400">Volný prostor u vstupu</text><rect x="75" y="215" width="230" height="100" rx="12" fill="#d9e8ed" stroke="#273a3d" stroke-width="3"/><text x="105" y="275" font-size="28" font-weight="400">Napájení</text><rect x="875" y="215" width="250" height="100" rx="12" fill="#e8d5ae" stroke="#273a3d" stroke-width="3"/><text x="915" y="275" font-size="28" font-weight="400">Krmivo</text><path d="M190 340 L420 500" fill="none" stroke="#a57312" stroke-width="4" stroke-dasharray="9 7"/><path d="M990 340 L800 500" fill="none" stroke="#a57312" stroke-width="4" stroke-dasharray="9 7"/><path d="M610 580 L610 640" fill="none" stroke="#a57312" stroke-width="4"/><text x="715" y="630" font-size="27" font-weight="400">Přístup pro obsluhu</text><text x="75" y="690" font-size="26" font-weight="400">Sledujte také vítr, odtok vody a chování skupiny.</text></g></svg>