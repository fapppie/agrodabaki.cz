<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Štěpkovač, nebo špalíkovač? Vyberte podle toho, co chcete z větví získat</title><desc id="desc">Schematické srovnání drobnější štěpky a delších špalíků; třetí krok připomíná dopravu materiálu.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">07</text><rect x="70" y="165" width="510" height="350" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="620" y="165" width="510" height="350" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="115" y="225" font-size="34" fill="#1f292b" font-weight="700">ŠTĚPKA</text><text x="665" y="225" font-size="34" fill="#1f292b" font-weight="700">ŠPALÍKY</text><path d="M150 280 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M210 300 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M270 270 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M330 320 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M180 365 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M250 375 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><path d="M310 385 l25 -8 l12 20 l-28 9 Z" fill="#b99161"/><rect x="690" y="270" width="135" height="42" rx="12" fill="#b99161" stroke="#273a3d" stroke-width="3"/><rect x="850" y="290" width="135" height="42" rx="12" fill="#b99161" stroke="#273a3d" stroke-width="3"/><rect x="730" y="345" width="135" height="42" rx="12" fill="#b99161" stroke="#273a3d" stroke-width="3"/><rect x="880" y="365" width="135" height="42" rx="12" fill="#b99161" stroke="#273a3d" stroke-width="3"/><text x="115" y="470" font-size="28" fill="#1f292b" font-weight="400">Drobnější částice</text><text x="665" y="470" font-size="28" fill="#1f292b" font-weight="400">Delší kusy větví</text><t