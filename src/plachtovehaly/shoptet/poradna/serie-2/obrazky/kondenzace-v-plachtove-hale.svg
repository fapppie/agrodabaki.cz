<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Proč v plachtové hale kape voda, i když neprší? Kondenzace a možnosti řešení</title><desc id="desc">Schéma tří míst ke kontrole: chladná plachta, vlhkost uvnitř haly a voda u podlahy.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">01</text><path d="M250 505 V300 L600 170 L950 300 V505 Z" fill="#ffffff" stroke="#273a3d" stroke-width="7"/><path d="M430 505 V350 H770 V505" fill="#edf3f2" stroke="#273a3d" stroke-width="5"/><path d="M450 285 q-18 28 0 28 q18 0 0 -28" fill="#4a859c"/><path d="M550 285 q-18 28 0 28 q18 0 0 -28" fill="#4a859c"/><path d="M650 285 q-18 28 0 28 q18 0 0 -28" fill="#4a859c"/><path d="M750 285 q-18 28 0 28 q18 0 0 -28" fill="#4a859c"/><path d="M370 465 L370 350" fill="none" stroke="#4a859c" stroke-width="5"/><path d="M370 350 L356 372" fill="none" stroke="#4a859c" stroke-width="5"/><path d="M370 350 L384 372" fill="none" stroke="#4a859c" stroke-width="5"/><rect x="505" y="430" width="170" height="75" rx="12" fill="#d1bc96" stroke="#273a3d" stroke-width="3"/><text x="70" y="150" font-size="30" fill="#1f292b" font-weight="400">1  Chladný povrch</text><path d="M355 155 L475 215" fill="none" stroke="#273a3d" stroke-width="5"/><text x="730" y="570" font-size="30" fill="#1f292b" font-weight="400">2  Vlhkost uvnitř</text><text x="70" y="570" font-size="30" fill="#1f292b" font-weight="400">3  Voda u podlahy</text><path d="M260 540 L300 495" fill="none" stroke="#273a3d" stroke-width="5"/><text x="75" y="635" font-size="28" fill="#1f292b" font-weight="400">Sledujte místo výskytu, počasí a změny provozu.</text></g></svg>