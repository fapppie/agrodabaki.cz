<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Plachtová hala před zimou: co zkontrolovat na plachtě, vratech a konstrukci</title><desc id="desc">Schéma čtyř kontrolních oblastí haly: opláštění, spoje, vrata a kotvení.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">04</text><path d="M250 505 V300 L600 170 L950 300 V505 Z" fill="#ffffff" stroke="#273a3d" stroke-width="7"/><path d="M430 505 V350 H770 V505" fill="#edf3f2" stroke="#273a3d" stroke-width="5"/><circle cx="600" cy="220" r="25" fill="#f3c54c"/><text x="591" y="230" font-size="30" fill="#1f292b" font-weight="700">1</text><circle cx="300" cy="325" r="25" fill="#f3c54c"/><text x="291" y="335" font-size="30" fill="#1f292b" font-weight="700">2</text><circle cx="600" cy="410" r="25" fill="#f3c54c"/><text x="591" y="420" font-size="30" fill="#1f292b" font-weight="700">3</text><circle cx="920" cy="505" r="25" fill="#f3c54c"/><text x="911" y="515" font-size="30" fill="#1f292b" font-weight="700">4</text><text x="70" y="125" font-size="28" fill="#1f292b" font-weight="400">1  Opláštění</text><text x="770" y="125" font-size="28" fill="#1f292b" font-weight="400">2  Spoje</text><text x="70" y="590" font-size="28" fill="#1f292b" font-weight="400">3  Vrata a zajištění</text><text x="730" y="590" font-size="28" fill="#1f292b" font-weight="400">4  Kotvení</text><text x="75" y="650" font-size="28" fill="#1f292b" font-weight="400">Kontrolujte podle návodu svého modelu.</text></g></svg>