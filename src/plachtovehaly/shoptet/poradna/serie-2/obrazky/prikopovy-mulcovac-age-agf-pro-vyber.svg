<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Příkopový mulčovač za traktor: stačí výkon, nebo rozhoduje i hmotnost a dosah?</title><desc id="desc">Porovnání AGE 145 a AGF 140 PRO: podobný pracovní záběr, hmotnosti 290 a 550 kilogramů.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">06</text><rect x="70" y="160" width="510" height="400" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="620" y="160" width="510" height="400" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="115" y="220" font-size="37" fill="#1f292b" font-weight="700">AGE 145</text><text x="665" y="220" font-size="37" fill="#1f292b" font-weight="700">AGF 140 PRO</text><text x="115" y="300" font-size="30" fill="#1f292b" font-weight="400">Záběr 145 cm</text><text x="665" y="300" font-size="30" fill="#1f292b" font-weight="400">Záběr 140 cm</text><rect x="115" y="365" width="215" height="80" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><rect x="665" y="365" width="408" height="80" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="115" y="510" font-size="52" fill="#1f292b" font-weight="700">290 kg</text><text x="665" y="510" font-size="52" fill="#1f292b" font-weight="700">550 kg</text><text x="75" y="625" font-size="30" fill="#1f292b" font-weight="400">Podobný záběr. Rozdíl hmotnosti 260 kg.</text><text x="75" y="665" font-size="26" fill="#1f292b" font-weight="400">Vhodnost traktoru se posuzuje pro celou sestavu.</text></g></svg>