<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Paletizační vidle za traktor: jak vybrat nosnost, uchycení a délku vidlic</title><desc id="desc">Schéma nákladu na vidlích s vyznačením těžiště, jeho vzdálenosti a délky vidlic.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">08</text><rect x="330" y="220" width="520" height="235" rx="12" fill="#e8d5ae" stroke="#273a3d" stroke-width="3"/><path d="M260 180 L260 490" fill="none" stroke="#273a3d" stroke-width="5"/><path d="M260 490 L960 490" fill="none" stroke="#273a3d" stroke-width="5"/><path d="M330 465 L850 465" fill="none" stroke="#273a3d" stroke-width="5"/><circle cx="590" cy="330" r="15" fill="#c67c14"/><path d="M590 300 L590 360" fill="none" stroke="#c67c14" stroke-width="5"/><path d="M560 330 L620 330" fill="none" stroke="#c67c14" stroke-width="5"/><text x="670" y="185" font-size="29" fill="#1f292b" font-weight="400">Těžiště nákladu</text><path d="M690 195 L600 310" fill="none" stroke="#273a3d" stroke-width="5"/><path d="M260 540 L590 540" fill="none" stroke="#273a3d" stroke-width="5"/><text x="275" y="585" font-size="26" fill="#1f292b" font-weight="400">Vzdálenost těžiště</text><path d="M260 625 L960 625" fill="none" stroke="#273a3d" stroke-width="5"/><text x="700" y="665" font-size="26" fill="#1f292b" font-weight="400">Délka vidlic</text><text x="75" y="130" font-size="30" fill="#1f292b" font-weight="700">Náklad + vidle + možnosti traktoru</text></g></svg>