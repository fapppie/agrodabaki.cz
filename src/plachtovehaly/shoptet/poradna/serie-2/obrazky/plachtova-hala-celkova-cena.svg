<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Kolik stojí plachtová hala celkem? Co připočítat k ceně konstrukce</title><desc id="desc">Přehled rozpočtu: hala, podklad, kotvení, doprava a vykládka, montáž a související podklady.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">05</text><rect x="70" y="165" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="95" y="200" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="155" y="230" font-size="26" fill="#1f292b" font-weight="400">Hala a příslušenství</text><rect x="620" y="165" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="645" y="200" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="705" y="230" font-size="26" fill="#1f292b" font-weight="400">Podklad a odvodnění</text><rect x="70" y="310" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="95" y="345" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="155" y="375" font-size="26" fill="#1f292b" font-weight="400">Založení a kotvení</text><rect x="620" y="310" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="645" y="345" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="705" y="375" font-size="26" fill="#1f292b" font-weight="400">Doprava a vykládka</text><rect x="70" y="455" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="95" y="490" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="155" y="520" font-size="26" fill="#1f292b" font-weight="400">Montáž a technika</text><rect x="620" y="455" width="510" height="115" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="645" y="490" width="38" height="38" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><text x="705" y="520" font-size="26" fill="#1f292b" font-weight="400">Související podklady</text><text x="75" y="650" font-size="28" fill="#1f292b" font-weight="400">U každé položky: rozsah • cena • kdo ji zajistí</text></g></svg>