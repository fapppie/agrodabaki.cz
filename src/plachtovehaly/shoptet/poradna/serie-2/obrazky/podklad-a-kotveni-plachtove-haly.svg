<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Co připravit pod plachtovou halu? Podklad, odvodnění a kotvení před objednávkou</title><desc id="desc">Půdorysný náčrt s halou, kontrolou rozměrů, okolním prostorem a příjezdem pro vykládku.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">02</text><rect x="250" y="180" width="700" height="350" rx="12" fill="#edf3f2" stroke="#273a3d" stroke-width="3"/><rect x="350" y="240" width="500" height="230" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><text x="490" y="365" font-size="30" fill="#1f292b" font-weight="700">PŮDORYS HALY</text><path d="M350 205 L850 205" fill="none" stroke="#273a3d" stroke-width="5"/><text x="485" y="145" font-size="25" fill="#1f292b" font-weight="400">Rozměry z výkresu</text><path d="M290 240 L290 470" fill="none" stroke="#273a3d" stroke-width="5"/><text x="80" y="330" font-size="26" fill="#1f292b" font-weight="400">Prostor</text><text x="80" y="365" font-size="26" fill="#1f292b" font-weight="400">pro montáž</text><path d="M590 465 L590 600" fill="none" stroke="#c48d16" stroke-width="5"/><path d="M590 600 L575 577" fill="none" stroke="#c48d16" stroke-width="5"/><text x="650" y="585" font-size="28" fill="#1f292b" font-weight="400">Příjezd a vykládka</text><text x="75" y="650" font-size="28" fill="#1f292b" font-weight="400">Zaměřte výšky, podklad a směr odtoku vody.</text></g></svg>