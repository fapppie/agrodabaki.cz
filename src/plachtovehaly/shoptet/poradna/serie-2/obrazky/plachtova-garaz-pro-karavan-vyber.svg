<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Plachtová garáž pro karavan: co ověřit kromě délky a výšky</title><desc id="desc">Schéma obytného vozu s vyznačením celkové délky, střešní výbavy a místa pro otevření dveří.</desc><rect width="1200" height="720" rx="20" fill="#f0f3ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="24" fill="#1f292b" font-weight="700">AGRO DABAKI / PORADNA</text><text x="990" y="65" font-size="26" fill="#1f292b" font-weight="700">03</text><rect x="220" y="260" width="740" height="225" rx="12" fill="#fff" stroke="#273a3d" stroke-width="3"/><rect x="265" y="300" width="150" height="100" rx="12" fill="#d9e8ed" stroke="#273a3d" stroke-width="3"/><rect x="465" y="300" width="150" height="100" rx="12" fill="#d9e8ed" stroke="#273a3d" stroke-width="3"/><rect x="730" y="310" width="100" height="175" rx="12" fill="#f7eccb" stroke="#273a3d" stroke-width="3"/><rect x="565" y="225" width="130" height="35" rx="12" fill="#f3c54c" stroke="#273a3d" stroke-width="3"/><circle cx="365" cy="490" r="40" fill="#273a3d"/><circle cx="830" cy="490" r="40" fill="#273a3d"/><path d="M195 565 L985 565" fill="none" stroke="#273a3d" stroke-width="5"/><text x="420" y="610" font-size="30" fill="#1f292b" font-weight="400">Délka včetně příslušenství</text><path d="M1030 225 L1030 485" fill="none" stroke="#273a3d" stroke-width="5"/><text x="815" y="185" font-size="28" fill="#1f292b" font-weight="400">Střešní výbava</text><path d="M820 195 L670 228" fill="none" stroke="#273a3d" stroke-width="5"/><text x="75" y="180" font-size="28" fill="#1f292b" font-weight="400">Změřte i otevření dveří</text><text x="75" y="650" font-size="28" fill="#1f292b" font-weight="400">Ověřte průjezd i prostor kolem zaparkovaného vozu.</text></g></svg>